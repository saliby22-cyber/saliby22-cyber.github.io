    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        
        /* روابط التنقل الصفراء والمميزة لترويستك الفاخرة */
        .store-nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .store-nav a {
            color: #f0c419; /* نفس الكود الأصفر لترويستك */
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Tajawal', sans-serif;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .store-nav a:hover {
            color: #ffffff;
        }
        .store-nav a.btn-back {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .store-nav a.btn-back:hover {
            background-color: #b00;
        }

        /* تنسيق أقسام المتجر والمنتجات المتناسقة */
        .container {
            max-width: 1200px;
            margin: 40px auto 60px;
            padding: 0 15px;
        }
        .shop-section {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border-right: 4px solid #b00;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }
        .section-header h2 {
            margin: 0;
            font-size: 22px;
            color: #b00;
        }
        .badge-count {
            background-color: #fff1f1;
            color: #b00;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 30px;
        }
        .product-card {
            background-color: white;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }
        .product-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #b00;
            color: white;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            z-index: 10;
        }
        .product-image {
            width: 100%;
            height: 380px; 
            background-color: #fcfcfc;
            overflow: hidden;
            position: relative;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* تظهر كاملة بدون أي قص بناء على طلبك */
            transition: transform 0.4s ease;
        }
        .product-card:hover .product-image img {
            transform: scale(1.08); 
        }
        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .product-title {
            font-size: 17px;
            margin: 0 0 12px 0;
            color: #111;
            font-weight: 700;
            line-height: 1.5;
        }
        .en-text {
            font-family: 'Segoe UI', sans-serif;
            color: #777;
            font-size: 14px;
        }
        .product-meta {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed #eee;
            padding-top: 12px;
        }
        .product-meta span i {
            color: #b00;
            margin-left: 4px;
        }
        .product-price {
            font-size: 24px;
            color: #111;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .product-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
            border: none;
            gap: 8px;
        }
        .btn-primary {
            background-color: #1a1a1a;
            color: white;
        }
        .btn-primary:hover {
            background-color: #b00;
        }
        .btn-whatsapp {
            background-color: transparent;
            color: #25d366;
            border: 1.5px solid #25d366;
        }
        .btn-whatsapp:hover {
            background-color: #25d366;
            color: white;
        }
        @media (max-width: 768px) {
            .store-nav {
                flex-direction: column;
                gap: 12px;
                align-items: center;
            }
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
