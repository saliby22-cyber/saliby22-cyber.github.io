<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الإلكتروني | مؤسسة محمد خالد للحدادة</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --primary-color: #b11e1e; /* الأحمر الفاخر لمؤسستك */
            --gold-color: #ffcc00;    /* الأصفر الذهبي الفخم لموقعك */
            --dark-color: #1a1a1a;    /* الخلفية الداكنة لموقعك */
            --white: #ffffff;
            --gray: #666;
            --border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f9f9f9;
            color: #1a1a1a;
        }

        /* ترويسة المتجر الفاخرة المطابقة لموقعك الرئيسي والمدونة بالكامل */
        header {
            background-color: var(--dark-color);
            padding: 35px 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
        }

        /* الشعار الدائري الخاص بمؤسستك في الأعلى */
        .store-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            border-radius: 50%;
            border: 2px solid var(--gold-color);
            object-fit: cover;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            color: var(--gold-color); /* الخط الذهبي المميز لموقعك */
            font-weight: 700;
        }

        header .sub-title {
            margin: 0 0 20px 0;
            color: #ccc;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        /* أزرار القائمة الصفراء المطابقة لموقعك مع زر العودة الفخم */
        .store-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .store-nav a {
            color: var(--gold-color);
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .store-nav a:hover {
            color: var(--white);
        }

        /* تمييز زر العودة للخلف ليكون واضحاً */
        .store-nav a.btn-back {
            color: var(--white);
            background-color: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .store-nav a.btn-back:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* الحاوية الرئيسية وضبط الأبعاد لمنع تزحلق المنتجات */
        .container {
            max-width: 1200px;
            margin: 40px auto 60px;
            padding: 0 20px;
        }

        /* تصميم أقسام المتجر */
        .shop-section {
            background-color: var(--white);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-right: 5px solid var(--primary-color);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f4f4f4;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .section-header h2 {
            margin: 0;
            font-size: 22px;
            color: #1a1a1a;
        }

        .badge-count {
            background-color: #fff1f1;
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        /* شبكة عرض المنتجات */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* بطاقة المنتج الموزونة الترتيب */
        .product-card {
            background-color: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .product-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 10;
        }

        /* ضبط حجم إطار الصورة وثبات التكبير التفاعلي وميزة الحجم الكامل */
        .product-image {
            width: 100%;
            height: 360px; 
            background-color: #eee;
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* تظهر كاملة بدون أي قص بناء على طلبك */
            transition: transform 0.4s ease-in-out;
        }

        .product-card:hover .product-image img {
            transform: scale(1.08); 
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 17px;
            margin: 0 0 12px 0;
            color: #1a1a1a;
            font-weight: bold;
            line-height: 1.5;
            text-align: right;
        }

        .en-text {
            display: inline-block;
            direction: ltr;
            font-family: 'Segoe UI', sans-serif;
            color: #777;
        }

        .product-meta {
            font-size: 13px;
            color: var(--gray);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 24px;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 20px;
            text-align: right;
        }

        .product-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
            border: none;
            gap: 8px;
        }

        .btn-primary {
            background-color: #1a1a1a;
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--primary-color);
        }

        .btn-whatsapp {
            background-color: transparent;
            color: #25d366;
            border: 2px solid #25d366;
        }

        .btn-whatsapp:hover {
            background-color: #25d366;
            color: var(--white);
        }

        @media (max-width: 768px) {
            .store-nav {
                flex-direction: column;
                gap: 12px;
            }
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- الترويسة المدمجة الفاخرة المطابقة لروح موقعك والمدونة بالكامل -->
    <header>
        <!-- استدعاء نفس شعارك الرسمي المعتمد -->
        <img src="logo.jpg" alt="شعار مؤسسة محمد خالد" class="store-logo" onerror="this.style.display='none'">
        <h1>مؤسسة محمد خالد للحدادة – الأفرنجية</h1>
        <div class="sub-title">درايبزينات فلل • بوابات حديد فاخرة • أبواب مدنية</div>
        
        <!-- روابط التنقل والرجوع السلس للخلف -->
        <div class="store-nav">
            <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-right"></i> العودة للموقع الرئيسي وحاسبة الأوزان</a>
            <a href="index.html#blog"><i class="fa-solid fa-newspaper"></i> المدونة التقنية</a>
            <a href="shop.html" style="border-bottom: 2px solid var(--gold-color); padding-bottom: 2px;"><i class="fa-solid fa-store"></i> المتجر الإلكتروني</a>
        </div>
    </header>

    <div class="container">

        <!-- ================= القسم الأول: الأثاث المودرن والبار ================= -->
        <section class="shop-section">
            <div class="section-header">
                <h2><i class="fa-solid fa-chair"></i> قسم الأثاث المودرن والبار</h2>
                <span class="badge-count">قطعة واحدة متوفرة</span>
            </div>
            <div class="product-grid">
                
                <div class="product-card">
                    <div class="product-badge">تصميم خاص</div>
                    <div class="product-image">
                        <img src="modern-gold-room-divider.webp" alt="قاطع غرف حديدي مودرن ذهبي">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">
                            قاطع غرف هندسي فاخر وحامل نباتات 
                            <span class="en-text">(Room Divider)</span>
                        </h3>
                        
                        <div class="product-meta">
                            <span><i class="fa-solid fa-weight-hanging"></i> الوزن: 24 كغ</span>
